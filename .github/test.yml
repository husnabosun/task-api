name: run tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name : checkout code
        uses : actions/checkout@v4

      - name: Set up node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: install node dependencies
        run: npm install

      - name : start server
        run: node index.js &

      - name: wait for server to be ready
        run: sleep 2
      
      - name : set up python
        uses: actions/setup-python@v5
        with:
          python-version : '3.11'
      
      - name : install python dependencies
        run : pip install -r python-tests/requirements.txt

      - name : run tests
        run : pytest python-tests/-v